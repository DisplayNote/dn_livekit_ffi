# Azure DevOps Pipeline
parameters:
  - name: pool_name
    type: string
  - name: target_name
    type: string
  # Every arch builds in this one job from a single WebRTC checkout.
  # Each entry is { arch: <build_<os> --arch>, profile: <DN Conan profile> }
  - name: archs
    type: object
  - name: os
    type: string
  - name: cmd
    type: string

stages:
- stage: webrtc_${{ parameters.target_name }}
  displayName: Build WebRTC - ${{ parameters.target_name }}
  dependsOn: []
  jobs:
  - job: BuildJob
    displayName: Build WebRTC
    # One checkout plus a full build per arch can exceed the 60-minute default
    timeoutInMinutes: 180
    pool:
      name: ${{ parameters.pool_name }}
    variables:
      libwebrtc_dir: $(Build.SourcesDirectory)/dn_livekit_ffi/webrtc-sys/libwebrtc
    steps:
    - task: UsePythonVersion@0
      displayName: Use Python $(python.version)
      inputs:
        versionSpec: '$(python.version)'
        architecture: 'x64'

    - task: Bash@3
      displayName: Install setuptools
      inputs:
        targetType: 'inline'
        script: pip3 install setuptools

    # Explicit path: common/conan/config.yml also checks out the ci repo
    - checkout: self
      submodules: true
      path: s/dn_livekit_ffi

    - template: common/conan/config.yml@ci

    # Prebuilt libwebrtc lives in the DN Conan remote as webrtc/137.<hash>@dn/livekit, where the
    # hash covers the pinned revision, DN patches/scripts and build params (webrtc_fingerprint.sh)
    - task: Bash@3
      displayName: Init WebRTC cache lookup
      inputs:
        targetType: 'inline'
        script: echo "##vso[task.setvariable variable=webrtc_all_hit]true"

    - ${{ each build in parameters.archs }}:
      - task: Bash@3
        displayName: Fetch WebRTC ${{ build.arch }} from Conan
        inputs:
          targetType: 'inline'
          script: |
            set -uo pipefail
            ref=$(bash ./webrtc_fingerprint.sh ${{ parameters.target_name }} ${{ build.arch }} release) || exit 1
            echo "##vso[task.setvariable variable=webrtc_ref_${{ build.arch }}]$ref"
            deploy="$(Agent.TempDirectory)/webrtc-deploy-${{ build.arch }}"
            out="${{ parameters.target_name }}-${{ build.arch }}-release"
            rm -rf "$deploy" "$out"
            if conan install "$ref" -pr ${{ build.profile }} -s build_type=Release -r dn -g deploy -if "$deploy"; then
              mv "$deploy/webrtc" "$out"
              echo "Cache hit: $ref"
              echo "##vso[task.setvariable variable=webrtc_hit_${{ build.arch }}]true"
            else
              echo "Cache miss: $ref, building WebRTC ${{ build.arch }}"
              echo "##vso[task.setvariable variable=webrtc_all_hit]false"
            fi
          workingDirectory: $(libwebrtc_dir)

    - task: Bash@3
      displayName: Install linux dependencies
      condition: and(succeeded(), eq('${{ parameters.os }}', 'ubuntu-latest'), ne(variables['webrtc_all_hit'], 'true'))
      inputs:
        targetType: 'inline'
        script: |
          sudo apt update -y
          sudo apt install -y ninja-build pkg-config openjdk-11-jdk

    - task: Bash@3
      displayName: Install macos dependencies
      condition: and(succeeded(), eq('${{ parameters.os }}', 'macos-13'), ne(variables['webrtc_all_hit'], 'true'))
      inputs:
        targetType: 'inline'
        script: brew install ninja

    - task: PowerShell@2
      displayName: Install windows dependencies
      condition: and(succeeded(), eq('${{ parameters.os }}', 'windows-latest'), ne(variables['webrtc_all_hit'], 'true'))
      inputs:
        targetType: 'inline'
        script: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath $(Agent.TempDirectory)\ninja
          Write-Host "##vso[task.prependpath]$(Agent.TempDirectory)\ninja"

    - template: ../install-windows-sdk.yml

    # gclient's git mirrors and CIPD packages, reused across runs per OS and target
    - task: Cache@2
      displayName: Cache WebRTC dependencies
      condition: and(succeeded(), ne(variables['webrtc_all_hit'], 'true'))
      inputs:
        # Not keyed on .gclient: the steps below rewrite it, which would block the save
        key: 'webrtc-deps-v1 | "$(Agent.OS)" | "${{ parameters.target_name }}" | "m137_release"'
        restoreKeys: |
          webrtc-deps-v1 | "$(Agent.OS)" | "${{ parameters.target_name }}"
        path: $(Pipeline.Workspace)/webrtc-cache

    - task: Bash@3
      displayName: Configure gclient
      condition: and(succeeded(), ne(variables['webrtc_all_hit'], 'true'))
      inputs:
        targetType: 'inline'
        # Replace, not append: gclient rejects a second assignment of a variable
        script: |
          ninja --version
          cache_root="$(Pipeline.Workspace)/webrtc-cache"
          if command -v cygpath >/dev/null; then cache_root=$(cygpath -m "$cache_root"); fi
          mkdir -p "$cache_root/git" "$cache_root/cipd"
          sed -i '/^target_os\s*=/d; /^cache_dir\s*=/d' .gclient
          echo "target_os = [\"${{ parameters.target_name }}\"]" >> .gclient
          echo "cache_dir = \"$cache_root/git\"" >> .gclient
          echo "##vso[task.setvariable variable=CIPD_CACHE_DIR]$cache_root/cipd"
          cat .gclient
        workingDirectory: $(libwebrtc_dir)

    - ${{ each build in parameters.archs }}:
      - task: Bash@3
        displayName: Build WebRTC ${{ build.arch }} (Unix)
        condition: and(succeeded(), ne('${{ parameters.os }}', 'windows-latest'), ne(variables['webrtc_hit_${{ build.arch }}'], 'true'))
        inputs:
          targetType: 'inline'
          script: ${{ parameters.cmd }} --arch ${{ build.arch }} --profile release
          workingDirectory: $(libwebrtc_dir)

      - task: CmdLine@2
        displayName: Build WebRTC ${{ build.arch }} (Windows)
        condition: and(succeeded(), eq('${{ parameters.os }}', 'windows-latest'), ne(variables['webrtc_hit_${{ build.arch }}'], 'true'))
        inputs:
          script: ${{ parameters.cmd }} --arch ${{ build.arch }} --profile release
          workingDirectory: $(libwebrtc_dir)

      # Upload problems must not fail the build: the cache is only an optimisation
      - task: Bash@3
        displayName: Store WebRTC ${{ build.arch }} in Conan
        condition: and(succeeded(), ne(variables['webrtc_hit_${{ build.arch }}'], 'true'))
        continueOnError: true
        inputs:
          targetType: 'inline'
          script: |
            set -euo pipefail
            ref="$(webrtc_ref_${{ build.arch }})"
            conan export-pkg conan/conanfile.py "$ref" -pr ${{ build.profile }} -s build_type=Release \
              --package-folder "${{ parameters.target_name }}-${{ build.arch }}-release" -f
            conan upload "$ref" -r dn --all -c
          workingDirectory: $(libwebrtc_dir)

      - task: Bash@3
        displayName: List ${{ build.arch }} results
        inputs:
          targetType: 'inline'
          script: ls -l
          workingDirectory: $(libwebrtc_dir)/${{ parameters.target_name }}-${{ build.arch }}-release

      - task: CopyFiles@2
        inputs:
          sourceFolder: '$(libwebrtc_dir)/${{ parameters.target_name }}-${{ build.arch }}-release'
          contents: '**/*'
          targetFolder: $(Build.ArtifactStagingDirectory)/${{ parameters.target_name }}-${{ build.arch }}-release
        displayName: 'PUBLISH | Copy ${{ build.arch }} results'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.target_name }}-${{ build.arch }}-release'
          artifact: webrtc-${{ parameters.target_name }}-${{ build.arch }}-release
          publishLocation: 'pipeline'
        displayName: 'PUBLISH | Publish ${{ build.arch }} results'
