# Azure DevOps Pipeline
parameters:
  - name: pool_name
    type: string
  - name: target_name
    type: string
  # Every arch builds in this one job from a single WebRTC checkout
  - name: archs
    type: object
  - name: os
    type: string
  - name: cmd
    type: string

stages:
- stage: webrtc_${{ parameters.target_name }}
  displayName: Build WebRTC - ${{ parameters.target_name }}
  dependsOn: []
  jobs:
  - job: BuildJob
    displayName: Build WebRTC
    # One checkout plus a full build per arch can exceed the 60-minute default
    timeoutInMinutes: 180
    pool:
      name: ${{ parameters.pool_name }}
    steps:
    - task: UsePythonVersion@0
      displayName: Use Python $(python.version)
      inputs:
        versionSpec: '$(python.version)'
        architecture: 'x64'

    - task: Bash@3
      displayName: Install setuptools
      inputs:
        targetType: 'inline'
        script: pip3 install setuptools

    - task: Bash@3
      displayName: Install linux dependencies
      condition: eq('${{ parameters.os }}', 'ubuntu-latest')
      inputs:
        targetType: 'inline'
        script: |
          sudo apt update -y
          sudo apt install -y ninja-build pkg-config openjdk-11-jdk

    - task: Bash@3
      displayName: Install macos dependencies
      condition: eq('${{ parameters.os }}', 'macos-13')
      inputs:
        targetType: 'inline'
        script: brew install ninja

    - task: PowerShell@2
      displayName: Install windows dependencies
      condition: eq('${{ parameters.os }}', 'windows-latest')
      inputs:
        targetType: 'inline'
        script: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath $(System.DefaultWorkingDirectory)\ninja
          Write-Host "##vso[task.prependpath]$(System.DefaultWorkingDirectory)\ninja"

    - template: ../install-windows-sdk.yml

    - task: Bash@3
      displayName: Print ninja version
      inputs:
        targetType: 'inline'
        script: ninja --version

    - checkout: self
      submodules: true

    # gclient's git mirrors and CIPD packages, reused across runs per OS and target
    - task: Cache@2
      displayName: Cache WebRTC dependencies
      inputs:
        # Not keyed on .gclient: the steps below rewrite it, which would block the save
        key: 'webrtc-deps-v1 | "$(Agent.OS)" | "${{ parameters.target_name }}" | "m137_release"'
        restoreKeys: |
          webrtc-deps-v1 | "$(Agent.OS)" | "${{ parameters.target_name }}"
        path: $(Pipeline.Workspace)/webrtc-cache

    - task: Bash@3
      displayName: Configure gclient
      inputs:
        targetType: 'inline'
        # Replace, not append: gclient rejects a second assignment of a variable
        script: |
          cache_root="$(Pipeline.Workspace)/webrtc-cache"
          if command -v cygpath >/dev/null; then cache_root=$(cygpath -m "$cache_root"); fi
          mkdir -p "$cache_root/git" "$cache_root/cipd"
          sed -i '/^target_os\s*=/d; /^cache_dir\s*=/d' .gclient
          echo "target_os = [\"${{ parameters.target_name }}\"]" >> .gclient
          echo "cache_dir = \"$cache_root/git\"" >> .gclient
          echo "##vso[task.setvariable variable=CIPD_CACHE_DIR]$cache_root/cipd"
          cat .gclient
        workingDirectory: $(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc

    - ${{ each arch in parameters.archs }}:
      - task: Bash@3
        displayName: Build WebRTC ${{ arch }} (Unix)
        condition: and(succeeded(), ne('${{ parameters.os }}', 'windows-latest'))
        inputs:
          targetType: 'inline'
          script: ${{ parameters.cmd }} --arch ${{ arch }} --profile release
          workingDirectory: $(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc

      - task: CmdLine@2
        displayName: Build WebRTC ${{ arch }} (Windows)
        condition: and(succeeded(), eq('${{ parameters.os }}', 'windows-latest'))
        inputs:
          script: ${{ parameters.cmd }} --arch ${{ arch }} --profile release
          workingDirectory: $(System.DefaultWorkingDirectory)\webrtc-sys\libwebrtc

      - task: Bash@3
        displayName: List ${{ arch }} results
        inputs:
          targetType: 'inline'
          script: ls -l
          workingDirectory: $(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc/${{ parameters.target_name }}-${{ arch }}-release

      - task: CopyFiles@2
        inputs:
          sourceFolder: '$(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc/${{ parameters.target_name }}-${{ arch }}-release'
          contents: '**/*'
          targetFolder: $(Build.ArtifactStagingDirectory)/${{ parameters.target_name }}-${{ arch }}-release
        displayName: 'PUBLISH | Copy ${{ arch }} results'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.target_name }}-${{ arch }}-release'
          artifact: webrtc-${{ parameters.target_name }}-${{ arch }}-release
          publishLocation: 'pipeline'
        displayName: 'PUBLISH | Publish ${{ arch }} results'
