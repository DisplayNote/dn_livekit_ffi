# Azure DevOps Pipeline
parameters:
  - name: pool_name
    type: string
  - name: target_name
    type: string
  - name: arch
    type: string
  - name: os
    type: string
  - name: cmd
    type: string

stages:
- stage: webrtc_${{ parameters.target_name }}_${{ parameters.arch }}
  displayName: Build WebRTC - ${{ parameters.target_name }}-${{ parameters.arch }}
  dependsOn: []
  jobs:
  - job: BuildJob
    displayName: Build WebRTC
    pool:
      name: ${{ parameters.pool_name }}
    steps:
    - task: Bash@3
      displayName: Setup variables
      inputs:
        targetType: 'inline'
        script: |
          echo "Target Name: ${{ parameters.target_name }}"
          echo "Architecture: ${{ parameters.arch }}"
          DEFAULT_OUT=${{ parameters.target_name }}-${{ parameters.arch }}
          OUT=$DEFAULT_OUT-release
          echo "##vso[task.setvariable variable=OUT]$OUT"

    - task: Bash@3
      displayName: Info
      inputs:
        targetType: 'inline'
        script: |
          echo "OutName: $(OUT)"

    - task: CmdLine@2
      displayName: Info
      condition: eq('${{ parameters.os }}', 'windows-latest')
      inputs:
        targetType: 'inline'
        script: |
          echo "OutName: $(OUT)"

    - task: UsePythonVersion@0
      displayName: Use Python $(python.version)
      inputs:
        versionSpec: '$(python.version)'
        architecture: 'x64'

    - task: Bash@3
      displayName: Install setuptools
      inputs:
        targetType: 'inline'
        script: pip3 install setuptools

    - task: Bash@3
      displayName: Install linux dependencies
      condition: eq('${{ parameters.os }}', 'ubuntu-latest')
      inputs:
        targetType: 'inline'
        script: |
          sudo apt update -y
          sudo apt install -y ninja-build pkg-config openjdk-11-jdk

    - task: Bash@3
      displayName: Install macos dependencies
      condition: eq('${{ parameters.os }}', 'macos-13')
      inputs:
        targetType: 'inline'
        script: brew install ninja

    - task: PowerShell@2
      displayName: Install windows dependencies
      condition: eq('${{ parameters.os }}', 'windows-latest')
      inputs:
        targetType: 'inline'
        script: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath $(System.DefaultWorkingDirectory)\ninja
          Write-Host "##vso[task.prependpath]$(System.DefaultWorkingDirectory)\ninja"

    # WebRTC m137's setup_toolchain.py requires Windows SDK 10.0.26100.0; the agent image lacks its headers
    - task: PowerShell@2
      displayName: Install Windows SDK 10.0.26100
      condition: eq('${{ parameters.os }}', 'windows-latest')
      inputs:
        targetType: 'inline'
        script: |
          $sdkUm = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\um"
          if (Test-Path $sdkUm) {
            Write-Host "Windows SDK 10.0.26100.0 already installed"
            exit 0
          }
          # Standalone installer for 10.0.26100.3323, the version Chromium m137 pins
          $setup = "$(Agent.TempDirectory)\winsdksetup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2305205" -OutFile $setup
          $log = "$(Agent.TempDirectory)\winsdk.log"
          Write-Host "Installing Windows SDK 10.0.26100.3323"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/features', 'OptionId.DesktopCPPx64', 'OptionId.DesktopCPPx86',
            'OptionId.DesktopCPParm64', 'OptionId.WindowsDesktopDebuggers',
            '/quiet', '/norestart', '/ceip', 'off', '/log', $log)
          # 3010 = success, reboot required
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            Write-Error "Windows SDK installer exited with $($p.ExitCode)"
            exit 1
          }
          if (-not (Test-Path $sdkUm)) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            Write-Error "Windows SDK 10.0.26100.0 headers still missing at $sdkUm"
            exit 1
          }

    - task: Bash@3
      displayName: Print ninja version
      inputs:
        targetType: 'inline'
        script: ninja --version

    - checkout: self
      submodules: true

    - task: Bash@3
      displayName: Target OS
      inputs:
        targetType: 'inline'
        # Replace, not append: gclient rejects a second target_os assignment
        script: |
          sed -i '/^target_os\s*=/d' .gclient
          echo "target_os = [\"${{ parameters.target_name }}\"]" >> .gclient
          cat .gclient
        workingDirectory: $(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc

    - task: Bash@3
      displayName: Build WebRTC (Unix)
      condition: ne('${{ parameters.os }}', 'windows-latest')
      inputs:
        targetType: 'inline'
        script: ${{ parameters.cmd }} --arch ${{ parameters.arch }} --profile release
        workingDirectory: $(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc

    - task: CmdLine@2
      displayName: Build WebRTC (Windows)
      condition: eq('${{ parameters.os }}', 'windows-latest')
      inputs:
        script: ${{ parameters.cmd }} --arch ${{ parameters.arch }} --profile release
        workingDirectory: $(System.DefaultWorkingDirectory)\webrtc-sys\libwebrtc

    - task: Bash@3
      displayName: List directories
      #condition: ne('${{ parameters.os }}', 'windows-latest')
      inputs:
        targetType: 'inline'
        script: ls -l
        workingDirectory: $(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc/$(OUT)

    # - task: PowerShell@2
    #   displayName: Build WebRTC (Windows)
    #   condition: eq('${{ parameters.os }}', 'windows-latest')
    #   inputs:
    #     targetType: 'inline'
    #     script: |
    #       $env:PATH = "$(System.DefaultWorkingDirectory)\ninja;$env:PATH"
    #       cmd /c "${{ parameters.cmd }} --arch ${{ parameters.arch }} --profile release"
    #     workingDirectory: $(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc

    - task: CmdLine@2
      displayName: Debug | Check directory existence
      condition: eq('${{ parameters.os }}', 'windows-latest')
      inputs:
        script: |
          if exist "$(System.DefaultWorkingDirectory)\webrtc-sys\libwebrtc\$(OUT)" (
            echo "Directory exists: $(System.DefaultWorkingDirectory)\webrtc-sys\libwebrtc\$(OUT)"
          ) else (
            echo "Directory does not exist: $(System.DefaultWorkingDirectory)\webrtc-sys\libwebrtc\$(OUT)"
          )

    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(System.DefaultWorkingDirectory)/webrtc-sys/libwebrtc/$(OUT)'
        contents: '**/*'
        targetFolder: $(Build.ArtifactStagingDirectory)
      displayName: 'PUBLISH | Copy results'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: webrtc-$(OUT)
        publishLocation: 'pipeline'
      displayName: 'PUBLISH | Publish results'
