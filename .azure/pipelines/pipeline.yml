# Azure DevOps Pipeline

trigger:
  tags:
    include:
      - "*"
  branches:
    exclude:
      - '*'

resources:
  repositories:
    - repository: ci
      type: github
      # "DisplayNote" is the org's GitHub App service connection; never use a
      # PAT-based connection here. It has to be a literal: variables are not
      # allowed in resources.repositories.endpoint
      # (https://developercommunity.visualstudio.com/t/allow-variables-at-resourcesrepositoriesrepository/816606).
      endpoint: "DisplayNote"
      name: DisplayNote/qt-conan-ci
      ref: refs/tags/2.0.0
    # AI Security Roadmap 4.1 — shared secret-scanning (gitleaks) and
    # dependency-scanning (OSV-Scanner + Grype) templates, tracked from main so
    # template updates are picked up automatically, like the other DisplayNote
    # repositories. Same DisplayNote GitHub App service connection as the ci
    # resource above.
    - repository: dn-templates
      type: github
      endpoint: "DisplayNote"
      name: DisplayNote/dn-pipeline-templates
      ref: refs/heads/main

variables:
  - name: python.version
    value: '3.9'
  - group: broadcast-environment-variables

# Stage order: setup (VERSION) and the two scan gates, SecretScan +
# DependencyScan (both dependsOn: [], in parallel) -> WebRTC builds -> FFI
# builds -> deploy. Every build stage dependency is explicit.
stages:
  - template: common/setup.yml@ci

  # Blocking (template default failOnFindings: true): a finding fails the run.
  # gitleaks scans the full history of the built ref, upstream LiveKit history
  # included; its accepted findings live in .gitleaksignore at the repo root, one
  # fingerprint per line, each preceded by its own comment line.
  - template: secret-scan-stage.yml@dn-templates
    parameters:
      pool:
        name: agent-pool-ubuntu2204-vmss
      workspaceClean: all

  # OSV-Scanner reads every Cargo.lock in the repo (the workspace, the examples
  # and the -sys crates). The two conanfiles only package prebuilt output and
  # declare no requirements. Time-boxed exceptions live in osv-scanner.toml.
  - template: dependency-scan-stage.yml@dn-templates
    parameters:
      pool:
        name: agent-pool-ubuntu2204-vmss
      workspaceClean: all

  - template: webrtc-builds.yml

  - template: ffi-builds.yml

  - template: prepare-conan-profile.yml
    parameters:
      dependencies: ['SecretScan', 'DependencyScan', 'Build_Windows_x64', 'Build_Android_ARMV7', 'Build_Android_ARMV8', 'Build_Android_X86_64']
      artifacts: ['ffi-android-arm64',  'ffi-android-armv7', 'ffi-android-x86_64', 'ffi-windows-x86_64']
      packageName: livekit-ffi
      conanProfiles: ['msvc19.x86_64', 'android.arm64-v8a', 'android.armeabi-v7a', 'android.x86_64']
