parameters:
  - name: rustup_toolchain
    type: string
    default: stable
  - name: rustup_target
    type: string

steps:
  - script: |
      curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${{ parameters.rustup_toolchain }}
      echo "##vso[task.prependpath]$HOME/.cargo/bin"
    displayName: Install rust
    condition: ne( variables['Agent.OS'], 'Windows_NT' )

  # The Windows agent image ships an older rustup toolchain; livekit needs Rust >= 1.80 (LazyLock)
  - script: |
      rustup update ${{ parameters.rustup_toolchain }} --no-self-update
      rustup default ${{ parameters.rustup_toolchain }}
    displayName: Update rust
    condition: eq( variables['Agent.OS'], 'Windows_NT' )

  - script: |
      rustup target add ${{ parameters.rustup_target }}
      rustc --version
    displayName: Verify Rust installation
