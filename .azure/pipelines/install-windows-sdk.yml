parameters:
  # Extra runtime condition, e.g. to skip the install when nothing will be compiled
  - name: condition
    type: string
    default: 'true'

steps:
# WebRTC m137 is built against Windows SDK 10.0.26100.0 (setup_toolchain.py requires it, and its
# NTDDI_VERSION=NTDDI_WIN11_GE define is reused by webrtc-sys); the agent image lacks its headers
- task: PowerShell@2
  displayName: Install Windows SDK 10.0.26100
  condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'), ${{ parameters.condition }})
  inputs:
    targetType: 'inline'
    script: |
      $sdkUm = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\um"
      if (Test-Path $sdkUm) {
        Write-Host "Windows SDK 10.0.26100.0 already installed"
        exit 0
      }
      # Standalone installer for 10.0.26100.3323, the version Chromium m137 pins
      $setup = "$(Agent.TempDirectory)\winsdksetup.exe"
      Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2305205" -OutFile $setup
      # The fwlink redirect is not pinned: refuse to run anything not signed by Microsoft
      $sig = Get-AuthenticodeSignature -FilePath $setup
      if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
        Write-Error "Windows SDK installer signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
        exit 1
      }
      $log = "$(Agent.TempDirectory)\winsdk.log"
      Write-Host "Installing Windows SDK 10.0.26100.3323"
      $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
        '/features', 'OptionId.DesktopCPPx64', 'OptionId.DesktopCPPx86',
        'OptionId.DesktopCPParm64', 'OptionId.WindowsDesktopDebuggers',
        '/quiet', '/norestart', '/ceip', 'off', '/log', $log)
      # 3010 = success, reboot required
      if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
        if (Test-Path $log) { Get-Content $log -Tail 40 }
        Write-Error "Windows SDK installer exited with $($p.ExitCode)"
        exit 1
      }
      if (-not (Test-Path $sdkUm)) {
        if (Test-Path $log) { Get-Content $log -Tail 40 }
        Write-Error "Windows SDK 10.0.26100.0 headers still missing at $sdkUm"
        exit 1
      }
