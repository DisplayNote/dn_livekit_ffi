stages:
- template: webrtc-builds-templates/webrtc-stage-template.yml
  parameters:
    target_name: win
    os: windows-latest
    pool_name: agent-pool-windows2022-vmss
    cmd: build_windows.cmd
    archs:
      - { arch: x64, profile: msvc19.x86_64 }

- template: webrtc-builds-templates/webrtc-stage-template.yml
  parameters:
    target_name: android
    os: ubuntu-latest
    pool_name: agent-pool-ubuntu2204-vmss
    cmd: ./build_android.sh
    archs:
      - { arch: arm, profile: android.armeabi-v7a }
      - { arch: arm64, profile: android.arm64-v8a }
      - { arch: x64, profile: android.x86_64 }
