steps:
# WebRTC m137 is built with NDK r28 (ANDROID_NDK_VERSION_ROLL=r28_1) and its jni_zero headers use
# C++20 features (std::same_as, implicit typename) that the agent's default NDK 25 clang rejects.
# cargo-ndk and webrtc-sys/build.rs both read ANDROID_NDK_HOME.
- task: Bash@3
  displayName: Install Android NDK r28b
  condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
  inputs:
    targetType: 'inline'
    script: |
      set -euo pipefail
      ndk_version=28.1.13356709
      sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
      if [ -z "$sdk" ]; then
        echo "##vso[task.logissue type=error]ANDROID_HOME/ANDROID_SDK_ROOT is not set"
        exit 1
      fi
      ndk="$sdk/ndk/$ndk_version"
      if [ -d "$ndk" ]; then
        echo "Android NDK $ndk_version already installed"
      else
        echo "Installing Android NDK $ndk_version"
        # Not `yes | sdkmanager`: yes gets SIGPIPE when sdkmanager exits and pipefail turns it into 141
        "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version" < <(yes) > /dev/null
      fi
      if [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
        echo "##vso[task.logissue type=error]Android NDK $ndk_version missing clang++ at $ndk"
        exit 1
      fi
      echo "##vso[task.setvariable variable=ANDROID_NDK_HOME]$ndk"
      echo "##vso[task.setvariable variable=ANDROID_NDK_ROOT]$ndk"
